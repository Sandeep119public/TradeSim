name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      symbol:
        description: "Perpetual market to smoke-test against public Binance data"
        type: choice
        required: true
        default: BTCUSDT
        options:
          - BTCUSDT
          - SOLUSDT
          - ETHUSDT
      interval:
        description: "Candle interval for the live smoke test"
        type: choice
        required: true
        default: 1m
        options:
          - 1m
          - 5m
          - 15m
          - 1h

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Run tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser integration tests
        run: npm run test:e2e
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Live Binance browser smoke test (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          TRADESIM_SMOKE_SYMBOL: ${{ inputs.symbol || 'BTCUSDT' }}
          TRADESIM_SMOKE_INTERVAL: ${{ inputs.interval || '1m' }}
        run: npm run test:e2e:live
